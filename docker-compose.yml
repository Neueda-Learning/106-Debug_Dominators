version: "3.8"

services:
  mysql:
    image: mysql:8.4
    container_name: mysql_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: N3u3da!
      MYSQL_DATABASE: payment_processing
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - springboot-network

  springboot-app:
    build:
      context: Backend/payment-processing-system
      dockerfile: Dockerfile
    container_name: springboot_container
    depends_on:
      - mysql
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:mysql://mysql:3306/payment_processing
      DB_USER: root
      DB_PASS: N3u3da!
      APP_CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "8082:8082"
    networks:
      - springboot-network

  frontend:
    build:
      context: Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: frontend_container
    ports:
      - "8085:80"
    depends_on:
      - springboot-app
    networks:
      - springboot-network

volumes:
  mysql-data:

networks:
  springboot-network:
