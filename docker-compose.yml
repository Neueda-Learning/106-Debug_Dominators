version: "3.8"

services:
  mysql:
    image: mysql:8.4
    container_name: mysql_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: N3u3da!
      MYSQL_DATABASE: payment_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - springboot-network

  springboot-app:
    build:
      context: Backend/payment-processing-system
      dockerfile: Dockerfile
    container_name: springboot_container
    depends_on:
      - mysql
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:mysql://mysql:3306/payment_db
      DB_USER: root
      DB_PASS: N3u3da!
    ports:
      - "8082:8082"
    networks:
      - springboot-network

  

volumes:
  mysql-data:

networks:
  springboot-network:
